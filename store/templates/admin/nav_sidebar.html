{% load i18n %}

<button
    class="sticky toggle-nav-sidebar"
    id="toggle-nav-sidebar"
    aria-label="{% translate 'Toggle navigation' %}"
></button>

<nav
    class="sticky"
    id="nav-sidebar"
    aria-label="{% translate 'Sidebar' %}"
>

    <input
        type="search"
        id="nav-filter"
        placeholder="{% translate 'Start typing to filter…' %}"
        aria-label="{% translate 'Filter navigation items' %}"
    >


    {% url 'admin:minoo_dashboard' as dashboard_url %}

    <div class="module">

        <table>

            <caption>

                <a
                    href="{{ dashboard_url }}"
                    class="section"
                >
                    MINOO
                </a>

            </caption>

            <tbody>

                <tr
                    class="model-minoo-dashboard
                    {% if request.path == dashboard_url %}
                        current-model
                    {% endif %}"
                >

                    <th scope="row">

                        <a
                            href="{{ dashboard_url }}"
                            {% if request.path == dashboard_url %}
                                aria-current="page"
                            {% endif %}
                        >
                            Dashboard
                        </a>

                    </th>

                </tr>

            </tbody>

        </table>

    </div>


    {% include "admin/app_list.html" with app_list=available_apps show_changelinks=False %}

</nav>
