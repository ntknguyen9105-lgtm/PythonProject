{% extends "admin/change_list.html" %}

{% block object-tools-items %}

    <li>
        <a
            href="{% url 'admin:product_image_recognition' %}"
            class="minoo-recognition-button"
        >
            <span class="minoo-search-icon">⌕</span>
            Tìm kính bằng hình ảnh
        </a>
    </li>

    {{ block.super }}

{% endblock %}


{% block extrastyle %}
{{ block.super }}

<style>
    .minoo-recognition-button {
        display: inline-flex !important;
        align-items: center;
        gap: 7px;

        padding: 3px 13px !important;

        border: 1px solid #d9bda7 !important;
        border-radius: 30px !important;

        background: #fffaf6 !important;
        color: #8f6245 !important;

        font-size: 13px !important;
        font-weight: 500 !important;

        text-decoration: none !important;

        transition:
            background-color 0.2s ease,
            border-color 0.2s ease,
            color 0.2s ease;
    }

    .minoo-recognition-button:hover {
        background: #fdf1e5 !important;
        border-color: #c99a78 !important;
        color: #754a31 !important;
    }

    .minoo-search-icon {
        font-size: 17px;
        line-height: 1;
        font-weight: 400;
    }
</style>

{% endblock %}
