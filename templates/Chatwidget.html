<!-- =====================================================
     NÚT LIÊN HỆ NỔI + CHATBOT
     DÁN VÀO base.html: SAU </footer>, TRƯỚC </body>
===================================================== -->

<div
    id="cw"
    class="cw"
    data-endpoint="{% url 'chat_send' %}"
    data-hotline="090 697 17 96"
    data-hotline-raw="0906971796"
    data-address="112 Thái Thị Bôi, Đà Nẵng"
    data-map="https://www.google.com/maps/search/?api=1&query=112%20Th%C3%A1i%20Th%E1%BB%8B%20B%C3%B4i%2C%20%C4%90%C3%A0%20N%E1%BA%B5ng%2C%20Vietnam"
    data-products="{% url 'products' %}"
    data-policies="{% url 'policies' %}"
>

    {% csrf_token %}

    <!-- KHUNG CHAT -->
    <div class="cw-panel" role="dialog" aria-label="Chat với MINOO Eyewear">

        <div class="cw-head">
            <img src="{% static 'images/logo.jpg' %}" alt="MINOO Eyewear">
            <div>
                <strong>MINOO Eyewear</strong>
                <span>Mắt kính Đà Nẵng</span>
            </div>
            <button type="button" class="cw-close" aria-label="Đóng khung chat">&times;</button>
        </div>

        <div class="cw-body" aria-live="polite"></div>

        <div class="cw-chips">
            <button type="button" class="cw-chip" data-key="address">Địa chỉ cửa hàng</button>
            <button type="button" class="cw-chip" data-key="products">Xem gọng kính</button>
            <button type="button" class="cw-chip" data-key="policy">Chính sách</button>
            <button type="button" class="cw-chip" data-key="hotline">Hotline</button>
            <button type="button" class="cw-chip" data-key="staff">Nhắn cho MINOO</button>
        </div>

        <form class="cw-form" autocomplete="off">
            <input
                type="text"
                class="cw-input"
                placeholder="Nhập tin nhắn..."
                maxlength="500"
                aria-label="Nhập tin nhắn"
            >
            <button type="submit" class="cw-send" aria-label="Gửi">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
            </button>
        </form>

    </div>


    <!-- 3 NÚT: ZALO – HOTLINE – CHATBOT -->
    <div class="cw-stack">

        <!-- Zalo: đang dùng số hotline. Nếu số Zalo khác, đổi 0906971796 bên dưới -->
        <a
            href="https://zalo.me/0906971796"
            target="_blank"
            rel="noopener noreferrer"
            class="cw-btn cw-btn-zalo"
            aria-label="Nhắn tin Zalo MINOO"
        >Zalo</a>

        <a href="tel:0906971796" class="cw-btn cw-btn-phone" aria-label="Gọi hotline 090 697 17 96">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
        </a>

        <button type="button" class="cw-btn cw-btn-chat" aria-label="Mở khung chat" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg>
            <span class="cw-dot"></span>
        </button>

    </div>

</div>

<script src="{% static 'js/chatwidget.js' %}"></script>
